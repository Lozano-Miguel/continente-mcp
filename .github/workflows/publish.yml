name: Publish

# Draft a GitHub release for tag vX.Y.Z and publish it; this workflow then releases the
# same version to npm. Prereleases go to the "next" dist-tag.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  npm:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or newer.
      - run: npm install --global npm@11
      - run: npm ci
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          if [ "$TAG" != "v$version" ] || [ "$lock" != "$version" ]; then
            echo "::error::Tag $TAG, package.json $version and package-lock.json $lock must agree."
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
