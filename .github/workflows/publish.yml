name: Publish

# Draft a GitHub release for tag vX.Y.Z and publish it; this workflow then releases the
# same version to npm and attaches the Claude Desktop extension. Prereleases go to "next".
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  npm:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or newer.
      - run: npm install --global npm@11
      - run: npm ci
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          if [ "$TAG" != "v$version" ] || [ "$lock" != "$version" ]; then
            echo "::error::Tag $TAG, package.json $version and package-lock.json $lock must agree."
            exit 1
          fi
      # Makes re-running a release safe; npm never accepts the same version twice.
      - name: Skip versions already on npm
        id: registry
        run: |
          spec=$(node -p "const p = require('./package.json'); p.name + '@' + p.version")
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$spec is already on npm; nothing to publish."
          fi
      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}

  extension:
    name: Attach Claude Desktop extension
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:bundle
      - name: Upload continente-mcp.mcpb to the release
        run: gh release upload "$TAG" build/continente-mcp.mcpb --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
